  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // Decodes the path 404.html encoded into the query string (see that
      // file for why) and restores the real URL via history.replaceState
      // before React Router mounts, so a direct link to a sub-page ends up
      // on the right route instead of stuck on "?/players/...".
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </body>
