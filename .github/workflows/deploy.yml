name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# The admin panel can fire off several commits to main in quick succession
# (e.g. saving stats for one game after another) — each push triggers its
# own run of this workflow, and without this, their "Deploy to gh-pages"
# steps can overlap and race to push the same branch, so all but the
# first lose with a git conflict. Serializing on a fixed group name (and
# cancelling any still-queued older run once a newer commit lands, since
# only the latest commit's build is ever worth deploying) fixes that.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
